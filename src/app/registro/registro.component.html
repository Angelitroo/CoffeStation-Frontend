<div class="auth">
  <aside class="auth-aside">
    <div class="auth-brand"><span><app-icon class="lg" name="coffee" /></span> CoffeStation</div>
    <div class="auth-quote">
      <h2>Tu café favorito, sin esperas.</h2>
      <p>Crea tu cuenta de cliente para hacer pedidos y aprovechar cupones exclusivos.</p>
    </div>
    <p class="text-small text-muted">© 2026 CoffeStation</p>
  </aside>

  <main class="auth-main">
    <form class="auth-form">
      <div>
        <h1>Crear cuenta</h1>
        <p class="text-muted">Regístrate como cliente en pocos segundos.</p>
      </div>

      <div class="field">
        <label for="nombre">Nombre de usuario</label>
        <div class="input-icon">
          <app-icon class="sm" name="user" />
          <input id="nombre" class="input" placeholder="lucia.fernandez" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-icon">
          <app-icon class="sm" name="mail" />
          <input id="email" type="email" class="input" placeholder="lucia@correo.com" />
        </div>
      </div>

      <div class="field">
        <label for="dni">DNI</label>
        <div class="input-icon">
          <app-icon class="sm" name="id" />
          <input id="dni" class="input" placeholder="12345678Z" maxlength="9" />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-icon">
          <app-icon class="sm" name="lock" />
          <input id="password" type="password" class="input" placeholder="••••••••" />
        </div>
      </div>

      <a routerLink="/login" class="btn btn-primary btn-block">Crear cuenta</a>

      <p class="auth-alt">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </main>
</div>
