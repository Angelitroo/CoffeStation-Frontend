<div class="grid">
  @for (c of categorias; track c.id) {
    <article class="card categoria">
      <div class="row">
        <span class="icono"><app-icon name="tag" /></span>
        <div class="card-title">{{ c.nombre }}</div>
        <span class="spacer"></span>
        @if (c.estado) {
          <span class="badge badge-success">Activa</span>
        } @else {
          <span class="badge">Inactiva</span>
        }
      </div>

      <div class="row pie">
        <div>
          <div class="strong">Disponibilidad</div>
          <div class="text-small text-muted">Activa o agota todos sus productos</div>
        </div>
        <span class="spacer"></span>
        <label class="switch">
          <input type="checkbox" [checked]="c.estado" aria-label="Disponibilidad de la categoría" /><span></span>
        </label>
      </div>
    </article>
  }
</div>
