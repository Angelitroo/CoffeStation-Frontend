<div class="layout" [class.menu-abierto]="menuAbierto">
  <aside class="sidebar">
    <a routerLink="/pedidos" class="brand">
      <span class="brand-mark">C</span>
      <span>
        <span class="brand-name">CoffeStation</span>
        <span class="brand-sub">Cafetería</span>
      </span>
    </a>

    <!-- Cada apartado se muestra según los permisos del backend (@PreAuthorize) -->
    <nav class="nav">
      @if (rol === 'ADMIN') {
        <a class="nav-item" routerLink="/dashboard" routerLinkActive="active"><app-icon name="dashboard" /> Hoy</a>
      }
      <a class="nav-item" routerLink="/pedidos" routerLinkActive="active">
        <app-icon name="pedidos" /> Pedidos <span class="count">5</span>
      </a>
      @if (rol !== 'ADMIN') {
        <a class="nav-item" routerLink="/nuevo-pedido" routerLinkActive="active"><app-icon name="bag" /> Nuevo pedido</a>
      }
      <a class="nav-item" routerLink="/productos" routerLinkActive="active"><app-icon name="coffee" /> Productos</a>
      <a class="nav-item" routerLink="/categorias" routerLinkActive="active"><app-icon name="tag" /> Categorías</a>
    </nav>

    @if (rol === 'ADMIN') {
      <div class="nav-group">Administración</div>
      <nav class="nav">
        <a class="nav-item" routerLink="/cupones" routerLinkActive="active"><app-icon name="ticket" /> Cupones</a>
        <a class="nav-item" routerLink="/informes" routerLinkActive="active"><app-icon name="chart" /> Informes</a>
      </nav>
    }

    <span class="spacer"></span>

    <a routerLink="/login" class="btn btn-block"><app-icon class="sm" name="logout" /> Cerrar sesión</a>
  </aside>

  <div class="backdrop" (click)="menuAbierto = false"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" (click)="menuAbierto = true" aria-label="Abrir menú">
        <app-icon name="menu" />
      </button>
      <h1>{{ pagina()['title'] }}</h1>
      <span class="spacer"></span>

      @if (rol === 'ADMIN') {
        <a routerLink="/productos/nuevo" class="btn btn-primary"><app-icon class="sm" name="plus" /> Nuevo producto</a>
      } @else {
        <a routerLink="/nuevo-pedido" class="btn btn-primary"><app-icon class="sm" name="plus" /> Nuevo pedido</a>
      }
      <button class="icon-btn" aria-label="Ayuda"><app-icon name="help" /></button>
      <button class="icon-btn" aria-label="Notificaciones"><app-icon name="bell" /></button>
      <span class="avatar" title="Laura Martín · {{ rol }}">LM</span>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
