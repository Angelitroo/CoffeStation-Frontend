@switch (estado) {
  @case ('PENDIENTE') {
    <span class="status pendiente">Pendiente</span>
  }
  @case ('EN_PREPARACION') {
    <span class="status preparacion">En preparación</span>
  }
  @case ('LISTO') {
    <span class="status listo">Listo</span>
  }
  @case ('ENTREGADO') {
    <span class="status entregado">Entregado</span>
  }
  @case ('CANCELADO') {
    <span class="status cancelado">Cancelado</span>
  }
}
