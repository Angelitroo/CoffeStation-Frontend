<!-- POST /productos/crear · PUT /productos/actualizar/{id} (ADMIN) -->
<form class="formulario">
  <a routerLink="/productos" class="muted small row volver"><app-icon class="sm" name="back" /> Productos</a>

  <div class="bloque">
    <div class="explicacion">
      <h2>Datos generales</h2>
      <p class="muted small">Nombre y descripción que se muestran en la carta.</p>
    </div>
    <div class="campos">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" class="input" maxlength="150" />
      </div>
      <div class="field">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" class="textarea" maxlength="150"></textarea>
        <span class="hint">Máximo 150 caracteres.</span>
      </div>
      <div class="field">
        <label for="categoria">Categoría</label>
        <select id="categoria" class="select">
          @for (c of categorias; track c.id) {
            <option>{{ c.nombre }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="bloque">
    <div class="explicacion">
      <h2>Precio</h2>
      <p class="muted small">El precio se guarda sin IVA.</p>
    </div>
    <div class="campos dos">
      <div class="field">
        <label for="precio">Precio sin IVA (€)</label>
        <input id="precio" type="number" step="0.01" min="0" class="input" />
      </div>
      <div class="field">
        <label for="iva">IVA (%)</label>
        <select id="iva" class="select">
          <option>4</option>
          <option selected>10</option>
          <option>21</option>
        </select>
      </div>
    </div>
  </div>

  <div class="bloque">
    <div class="explicacion">
      <h2>Alérgenos</h2>
      <p class="muted small">Marca los que contiene el producto.</p>
    </div>
    <div class="campos alergenos">
      @for (a of alergenos; track a.id) {
        <label class="checkbox"><input type="checkbox" /> {{ a.nombre }}</label>
      }
    </div>
  </div>

  <div class="bloque">
    <div class="explicacion">
      <h2>Estado</h2>
    </div>
    <div class="campos">
      <label class="checkbox"><input type="checkbox" checked /> Disponible para pedir</label>
      <label class="checkbox"><input type="checkbox" checked /> Activo en la carta</label>
    </div>
  </div>

  <div class="pie">
    <a routerLink="/productos" class="btn">Cancelar</a>
    <a routerLink="/productos" class="btn btn-primary">Guardar producto</a>
  </div>
</form>
