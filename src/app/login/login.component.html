<div class="auth">
  <aside class="auth-aside">
    <div class="auth-brand"><span><app-icon class="lg" name="coffee" /></span> CoffeStation</div>
    <div class="auth-quote">
      <h2>Cada taza, cada pedido, bajo control.</h2>
      <p>Gestiona la carta, los pedidos y las promociones de tu cafetería desde un único lugar.</p>
    </div>
    <p class="text-small text-muted">© 2026 CoffeStation</p>
  </aside>

  <main class="auth-main">
    <form class="auth-form">
      <div>
        <h1>Bienvenido de nuevo</h1>
        <p class="text-muted">Introduce tus credenciales para continuar.</p>
      </div>

      <div class="field">
        <label for="nombre">Usuario</label>
        <div class="input-icon">
          <app-icon class="sm" name="user" />
          <input id="nombre" class="input" placeholder="laura.martin" />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-icon">
          <app-icon class="sm" name="lock" />
          <input id="password" type="password" class="input" placeholder="••••••••" />
        </div>
      </div>

      <a routerLink="/dashboard" class="btn btn-primary btn-block">Iniciar sesión</a>

      <p class="auth-alt">¿Eres cliente y no tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    </form>
  </main>
</div>
