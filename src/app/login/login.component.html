<div class="auth">
  <div class="auth-box">
    <div class="auth-brand">
      <span class="brand-mark">C</span>
      <span class="strong">CoffeStation</span>
    </div>

    <form class="auth-form">
      <div>
        <h1>Iniciar sesión</h1>
        <p class="muted small">Accede con tu usuario de la cafetería.</p>
      </div>

      <div class="field">
        <label for="nombre">Usuario</label>
        <input id="nombre" class="input" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="input" autocomplete="current-password" />
      </div>

      <a routerLink="/dashboard" class="btn btn-primary btn-block">Entrar</a>
    </form>

    <p class="auth-alt small">¿Eres cliente y no tienes cuenta? <a routerLink="/registro" class="link">Crear cuenta</a></p>
  </div>
</div>
