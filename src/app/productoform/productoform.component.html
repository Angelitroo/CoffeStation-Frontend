<div class="page form-page">
  <div class="row">
    <a routerLink="/productos" class="btn btn-outline btn-sm"><app-icon class="sm" name="back" /> Volver a productos</a>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Datos del producto</div>
        <div class="card-subtitle">Información visible en la carta</div>
      </div>
    </div>
    <div class="card-body form-grid">
      <div class="field full">
        <label for="nombre">Nombre</label>
        <input id="nombre" class="input" placeholder="Ej. Cappuccino" />
      </div>
      <div class="field full">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" class="textarea" placeholder="Breve descripción (máx. 150 caracteres)"></textarea>
      </div>
      <div class="field">
        <label for="precio">Precio sin IVA (€)</label>
        <input id="precio" type="number" step="0.01" class="input" placeholder="0,00" />
      </div>
      <div class="field">
        <label for="iva">IVA</label>
        <select id="iva" class="select">
          <option>4%</option>
          <option selected>10%</option>
          <option>21%</option>
        </select>
      </div>
      <div class="field full">
        <label for="categoria">Categoría</label>
        <select id="categoria" class="select">
          @for (c of categorias; track c.id) {
            <option>{{ c.nombre }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Alérgenos</div>
        <div class="card-subtitle">Selecciona los alérgenos que contiene</div>
      </div>
    </div>
    <div class="card-body alergenos">
      @for (a of alergenos; track a.id) {
        <label class="alergeno">
          <input type="checkbox" />
          {{ a.nombre }}
        </label>
      }
    </div>
  </div>

  <div class="card">
    <div class="card-body opciones">
      <div class="row">
        <label class="switch"><input type="checkbox" checked aria-label="Disponible" /><span></span></label>
        <div>
          <div class="strong">Disponible</div>
          <div class="text-small text-muted">Puede pedirse en este momento</div>
        </div>
      </div>
      <div class="row">
        <label class="switch"><input type="checkbox" checked aria-label="Activo" /><span></span></label>
        <div>
          <div class="strong">Activo</div>
          <div class="text-small text-muted">Aparece en la carta</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <span class="spacer"></span>
      <a routerLink="/productos" class="btn btn-outline">Cancelar</a>
      <a routerLink="/productos" class="btn btn-primary">Guardar</a>
    </div>
  </div>
</div>
