<div class="auth">
  <a routerLink="/" class="auth-volver"><app-icon class="sm" name="back" /> Volver a la carta</a>

  <div class="auth-box">
    <div class="auth-brand">
      <span class="brand-mark">C</span>
      <span class="strong">CoffeStation</span>
    </div>

    <form class="auth-form">
      <div>
        <h1>Crear cuenta de cliente</h1>
        <p class="muted small">Para hacer pedidos y usar cupones personales.</p>
      </div>

      <div class="field">
        <label for="nombre">Nombre de usuario</label>
        <input id="nombre" class="input" autocomplete="username" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" class="input" autocomplete="email" />
      </div>

      <div class="field">
        <label for="dni">DNI</label>
        <input id="dni" class="input" maxlength="9" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="input" autocomplete="new-password" />
      </div>

      <a routerLink="/login" class="btn btn-primary btn-block">Crear cuenta</a>
    </form>

    <p class="auth-alt small">¿Ya tienes cuenta? <a routerLink="/login" class="link">Iniciar sesión</a></p>
  </div>
</div>
